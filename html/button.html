<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Button</title>
    <link rel="stylesheet" href="../css/button_style.css">
    <script src="../js/button_manager.js" type="text/javascript" defer></script>
    <link rel="icon" type="image/png" href="../button_logo.png"/>
</head>
<body>
    <div class="game-container">

        <!-- Score display -->
        <div class="score-display">
            <h1 class="buttons">Buttons:</h1>
            <span id="nb_score" class="btcounter">0</span>
            <div class="btcounter" id="cps_display"><p>0/s</p></div>
        </div>

        <!-- Main clickable button -->
        <img src="../button_logo.png" type="image/png" alt="button" id="mainButton" class="main-button" unselectable="on" onclick="AddButtonToScore()">

        <!-- Upgrades to the right -->
        <div class="upgrades-container">
            <ul id="upgrades">

                <li class="upgrade-item">
                    <div>
                        <button id="get_btnmakers" onClick="BuyButtonGenerator('buttonMaker')" class="buffer">Get a button maker</button>
                        <h3 class="buffer">&nbsp;Button makers&nbsp;:&nbsp;</h3>
                        <h3 class="buffer"><span id="nb_buttonMaker" class="counter">0</span></h3>
                        <br/>
                        <h3 class="buffer">&nbsp;Price&nbsp;:&nbsp;</h3>
                        <h3 class="buffer"><span id="price_buttonMaker" class="counter">0</span></h3>
                    </div>
                </li>

                <li class="upgrade-item">
                    <div>
                        <button id="get_buttonSewers" onClick="BuyButtonGenerator('buttonSewer')" class="buffer">Get a button sewer</button>
                        <h3 class="buffer">&nbsp;Button Sewers :&nbsp;</h3>
                        <h3 class="buffer"><span id="nb_buttonSewer" class="counter">0</span></h3>
                        <br/>
                        <h3 class="buffer">&nbsp;Price :&nbsp;</h3>
                        <h3 class="buffer"><span id="price_buttonSewer" class="counter">0</span></h3>
                    </div>
                </li>

                <li class="upgrade-item">
                    <div>
                        <button id="get_btnfarms" onClick="BuyButtonGenerator('buttonFarm')" class="buffer">Get a button farm</button>
                        <h3 class="buffer">&nbsp;Button Farms :&nbsp;</h3>
                        <h3 class="buffer"><span id="nb_buttonFarm" class="counter">0</span></h3>
                        <br/>
                        <h3 class="buffer">&nbsp;Price :&nbsp;</h3>
                        <h3 class="buffer"><span id="price_buttonFarm" class="counter">0</span></h3>
                    </div>
                </li>
				
            </ul>
        </div>

        <!-- Save / Reset buttons -->
        <div class="saveContainer">
            <button id="saver" onClick="SaveGame()" class="saver">Save game progress</button>
            <button id="reset" onClick="ResetGame()" class="reseter">Reset everything</button>
        </div>

    </div>
</body>
</html>
