<!DOCTYPE html>
<html>
<head>
    <title>Hewo</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../css/page_sacha_css.css">
</head>

<body class="bg">

    <h1 class="title">hewo</h1>

    <marquee behavior="alternate" scrollamount="30">
        <marquee behavior="alternate" direction="down" scrollamount="30">

            <h1 id="catTitle">:|</h1>


            <img class="hover-img"
     src="../oiia-cat-cat.gif"
     alt="cat"
     onmouseover="
        document.getElementById('catTitle').textContent=':3';
        this.closest('marquee').stop();
        this.closest('marquee').parentElement.closest('marquee').stop();
     "
     onmouseout="
        document.getElementById('catTitle').textContent=':|';
        this.closest('marquee').start();
        this.closest('marquee').parentElement.closest('marquee').start();
     ">



        </marquee>
    </marquee>

</body>
</html>
