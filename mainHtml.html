<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Viewer</title>
    <script src="js/pageViewerScript.js" type="text/javascript" defer></script>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
        }
        .header h1 {
            margin: 0;
        }
        .header .controls {
            display: flex;
            gap: 10px;
        }
        .controls button {
            font-size: 1.2em;
            padding: 5px 10px;
            cursor: pointer;
        }
        .iframe-container {
            width: 100%;
            padding-bottom: 56.25%;
            position: relative;
        }
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Page Viewer</h1>
        <div class="controls">
            <button id="prevPage">&larr;</button>
            <span id="current-viewing">Currently viewing: </span>
            <button id="nextPage">&rarr;</button>
        </div>
    </div>

    <div class="iframe-container">
        <iframe id="pageIframe" src="html/button.html"></iframe>
    </div>
    <div class="bottom-goober" style="position:fixed;bottom:0;left:0;width:100%;height:128px;"></div>

<script>
const GIFS = [
  { src: 'squareGooberRun.gif',  idle: false },
  { src: 'circleGooberRun.gif',  idle: false },
  { src: 'scaredGooberRun.gif',  idle: false },
  { src: 'circleGooberIdle.gif', idle: true  },
];

const CONFIG = {
  count:    25,
  size:     128,
  minSpeed: 0.25,
  maxSpeed: 1,
};

function randSpeed() {
  return (Math.random() * (CONFIG.maxSpeed - CONFIG.minSpeed) + CONFIG.minSpeed)
         * (Math.random() < 0.5 ? 1 : -1);
}

const wrap = document.querySelector('.bottom-goober');

for (let i = 0; i < CONFIG.count; i++) {
  const gif = GIFS[i % GIFS.length];
  const img = document.createElement('img');
  img.src    = gif.src;
  img.width  = CONFIG.size;
  img.height = CONFIG.size;
  img.style.cssText = 'position:absolute;bottom:0;display:block;';
  wrap.appendChild(img);

  const g = {
    el:   img,
    idle: gif.idle,
    x:    (i / CONFIG.count) * 80 + 2,
    vx:   gif.idle ? 0 : randSpeed(),
    bobT: Math.random() * Math.PI * 2,
  };

  (function(g) {
    let last = null;
    function tick(ts) {
      if (!last) last = ts;
      const dt = Math.min((ts - last) / 16.67, 3);
      last = ts;

      if (!g.idle) {
        g.bobT += 0.07 * dt;
        g.x    += g.vx * dt;

        const W = wrap.offsetWidth;
        if (g.x < 0)                       { g.x = 0;                              g.vx =  Math.abs(g.vx); }
        if ((g.x/100)*W + CONFIG.size > W) { g.x = ((W - CONFIG.size) / W) * 100; g.vx = -Math.abs(g.vx); }

        g.el.style.left      = g.x + '%';
        g.el.style.bottom    = (Math.sin(g.bobT) * 4) + 'px';
        g.el.style.transform = g.vx < 0 ? 'scaleX(-1)' : 'scaleX(1)';
      }

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })(g);
}
</script>
</body>
</html>
